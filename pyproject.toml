[project]
name = "first-experiments"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "torch>=2.7",
    "torchaudio>=2.7",
    "transformers>=5.0",
    "accelerate>=1.0",
    "datasets[audio]>=4.0",
    "evaluate>=0.4",
    "sacrebleu>=2.4",
    "jiwer>=3.0",
    "sentencepiece>=0.2",
    "huggingface-hub>=0.25",
    "trackio>=0.1",
    "python-dotenv>=1.0",
    "numpy>=1.26",
    "pandas>=2.2",
]

[dependency-groups]
dev = [
    "ruff>=0.8",
    "ipykernel>=6.29",
]

[tool.uv.sources]
torch = { index = "pytorch-cu126" }
torchaudio = { index = "pytorch-cu126" }

[[tool.uv.index]]
name = "pytorch-cu126"
url = "https://download.pytorch.org/whl/cu126"
explicit = true


[tool.ruff]
line-length = 110
target-version = "py312"
exclude = [
    ".venv",
    "build",
    "dist",
]

[tool.ruff.lint]
select = ["E", "F", "B", "UP", "I"]
fixable = ["ALL"]

[tool.ruff.lint.per-file-ignores]
"**/*.py" = ["E501"]

[tool.ruff.format]
# Use double quotes for strings.
quote-style = "double"

# Indent with spaces, rather than tabs.
indent-style = "space"

# Respect magic trailing commas.
skip-magic-trailing-comma = false

# Auto detect the appropriate line ending.
line-ending = "auto"

[tool.ruff.lint.mccabe]
max-complexity = 10
